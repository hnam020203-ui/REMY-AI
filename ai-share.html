function resolvePhantomProvider(){
  const candidates = [
    window.solana,
    window.phantom && window.phantom.solana,
    window.phantom,
    window.ethereum
  ];
  return candidates.find(p => p && (p.isPhantom || p.isSolana || p.connect || p.request));
}

async function connectPhantom(){
  const provider = resolvePhantomProvider();
  if(!provider || !(provider.isPhantom || provider.isSolana)){
    toast('Phantom extension not detected. Install Phantom and open this page via http://localhost:8000/ai-share.html');
    return;
  }
  try{
    const response = provider.isConnected ? { publicKey: provider.publicKey } : await provider.connect({ onlyIfTrusted: false });
    S.walletAddress = response?.publicKey ? response.publicKey.toString() : (provider.publicKey ? provider.publicKey.toString() : '');
    if(!S.walletAddress){throw new Error('No wallet address returned');}
    toast('Phantom wallet connected');
    drawMd();
  }catch(e){toast(e?.code===4001?'Phantom connection request was rejected.':(e?.message||'Phantom wallet connection failed.'));}
}

async function sendPhantomPayment(amountUsd){
  const provider = resolvePhantomProvider();
  if(!provider || !(provider.isPhantom || provider.isSolana)){throw new Error('Phantom wallet is not installed.');}
  if(!S.walletAddress){await connectPhantom();}
  if(!S.walletAddress){throw new Error('Connect Phantom wallet to continue.');}
  if(typeof solanaWeb3 === 'undefined'){throw new Error('Solana library failed to load.');}
  const lamports = Math.round(solEstimate(amountUsd) * 1e9);
  const connection = new solanaWeb3.Connection(new URL('/rpc', window.location.origin).toString(), 'confirmed');
  const fromPubkey = new solanaWeb3.PublicKey(S.walletAddress);
  const toPubkey = new solanaWeb3.PublicKey(RECEIVE_ADDRESS);
  const transaction = new solanaWeb3.Transaction();
  transaction.add(solanaWeb3.SystemProgram.transfer({ fromPubkey, toPubkey, lamports }));
  transaction.feePayer = fromPubkey;
  const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash();
  transaction.recentBlockhash = blockhash;
  let signature;
  if(typeof provider.signTransaction === 'function'){
    const signed = await provider.signTransaction(transaction);
    signature = await connection.sendRawTransaction(signed.serialize(), { skipPreflight: false });
  }else if(typeof provider.signAndSendTransaction === 'function'){
    const result = await provider.signAndSendTransaction(transaction);
    signature = result.signature || result?.signature?.toString();
  }else {
    throw new Error('This Phantom version does not support transaction signing.');
  }
  if(!signature){throw new Error('Phantom did not return a transaction signature.');}
  try{
    await connection.confirmTransaction({ signature, blockhash, lastValidBlockHeight }, 'confirmed');
  }catch(error){
    const { value: [status] } = await connection.getSignatureStatuses(
      [signature],
      { searchTransactionHistory: true }
    );
    if(status?.err){
      throw new Error(`Solana transaction failed: ${JSON.stringify(status.err)}`);
    }
    if(status?.confirmationStatus === 'confirmed' || status?.confirmationStatus === 'finalized'){
      return signature;
    }
    throw error;
  }
  return signature;
}
